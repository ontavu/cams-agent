name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The checks live in ci/check.sh. No protoc and no C++ toolchain: the bindings
  # come from cams-api, by its tag, so a stock runner and the Go toolchain are
  # all this needs.
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The release the Dockerfile builds with: the two move together.
          go-version: '1.27.1'
      - run: ./ci/check.sh

  # The image, built from the Dockerfile at the root. Its last check runs both
  # binaries, so a broken image fails here rather than on a LAN.
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cams-agent:ci .
